name: previo_aduanal
description: "Sistema Aduanal Integral - Integra Del Centro S.C."
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.0
  pdf: 3.11.3
  share_plus: ^12.0.2
  http: ^1.2.0
  intl: ^0.19.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#003087"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"